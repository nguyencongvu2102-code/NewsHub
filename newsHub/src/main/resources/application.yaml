server:
  port: 8080
  servlet:
    context-path: /newsHub


spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
      show-sql: false
      properties:
        hibernate:
          format_sql: true


jwt:
  signerKey: ${JWT_SECRET}
  valid_duration: 900
  refresh_duration: 604800000